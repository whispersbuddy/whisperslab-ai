<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3691ff"/>
      <stop offset="100%" stop-color="#8041ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="rgb(15,17,23)"/>
  <circle cx="180" cy="120" r="260" fill="url(#glow)"/>
  <circle cx="1040" cy="520" r="300" fill="url(#glow)"/>

  <!-- scattered "busywork" glyphs, faded, being pulled toward the card -->
  <g opacity="0.35" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none">
    <rect x="120" y="420" width="70" height="90" rx="6"/>
    <line x1="134" y1="444" x2="176" y2="444"/>
    <line x1="134" y1="460" x2="176" y2="460"/>
    <line x1="134" y1="476" x2="160" y2="476"/>

    <rect x="960" y="120" width="70" height="90" rx="6"/>
    <line x1="974" y1="144" x2="1016" y2="144"/>
    <line x1="974" y1="160" x2="1016" y2="160"/>
    <line x1="974" y1="176" x2="1000" y2="176"/>

    <circle cx="240" cy="180" r="26"/>
    <path d="M240 168v12l9 6"/>
  </g>

  <!-- dotted flow lines into the card -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" fill="none">
    <path d="M190 450 C 320 440, 400 400, 470 360"/>
    <path d="M990 190 C 860 220, 780 260, 730 300"/>
    <path d="M260 200 C 360 240, 420 280, 470 320"/>
  </g>

  <!-- central card: clean automated checklist -->
  <g filter="url(#soft)">
    <rect x="440" y="165" width="320" height="300" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <rect x="440" y="165" width="320" height="300" rx="24" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>

    <!-- checklist rows -->
    <g>
      <circle cx="480" cy="220" r="14" fill="url(#grad)"/>
      <path d="M474 220l4 5 9-11" stroke="#0f1117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="508" y="213" width="200" height="14" rx="7" fill="rgba(255,255,255,0.85)"/>

      <circle cx="480" cy="270" r="14" fill="url(#grad)"/>
      <path d="M474 270l4 5 9-11" stroke="#0f1117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="508" y="263" width="170" height="14" rx="7" fill="rgba(255,255,255,0.85)"/>

      <circle cx="480" cy="320" r="14" fill="url(#grad)"/>
      <path d="M474 320l4 5 9-11" stroke="#0f1117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="508" y="313" width="185" height="14" rx="7" fill="rgba(255,255,255,0.85)"/>

      <circle cx="480" cy="370" r="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <rect x="508" y="363" width="150" height="14" rx="7" fill="rgba(255,255,255,0.35)"/>
    </g>

    <!-- tiny "automated" spark -->
    <g transform="translate(700,195)">
      <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="url(#grad)"/>
    </g>
  </g>
</svg>
